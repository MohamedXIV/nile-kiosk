name: V001 Blender sprite previews

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/v001/**"
      - "scripts/v001/**"
      - "tests/test_v001_art.gd"
      - ".github/workflows/v001-blender-preview.yml"

permissions:
  contents: read

concurrency:
  group: v001-blender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-pil libegl1 libgl1
          blender --version | head -n 2
      - name: Bake day/night transparent sprites with fixed camera
        run: |
          set -o pipefail
          blender -b -t 2 --python tools/v001/bake_building.py -- --output assets/v001 2>&1 | tee /tmp/v001-bake.log
          if grep -E 'Traceback|ZeroDivisionError|RuntimeError' /tmp/v001-bake.log; then
            echo "Blender emitted a Python error, even if exit code is zero"
            exit 1
          fi
          test -s assets/v001/manifest.json
          test "$(find assets/v001 -maxdepth 1 -name '*.png' | wc -l)" -eq 14
      - name: Validate exact projection, transparent layers, and compose previews
        run: python3 tools/v001/validate_and_preview.py assets/v001 assets/v001/previews
      - name: Install Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Install pinned dialogue autoloads from the main game
        run: |
          mkdir -p addons
          git clone -q --depth 1 https://github.com/nathanhoad/godot_dialogue_manager.git /tmp/v001-dm
          git -C /tmp/v001-dm fetch -q --depth 1 origin 5487c524b9eac303b059e5859e2980b134c59d79
          git -C /tmp/v001-dm checkout -q 5487c524b9eac303b059e5859e2980b134c59d79
          cp -R /tmp/v001-dm/addons/dialogue_manager addons/dialogue_manager
          git clone -q --depth 1 --branch godot4 https://github.com/ephread/inkgd.git /tmp/v001-ink
          git -C /tmp/v001-ink checkout -q fea9098ee18d6cdbe9a5e25f8f0296bcdf0fd96a
          cp -R /tmp/v001-ink/addons/inkgd addons/inkgd
      - name: Temporarily hide editable Blender file from Godot importer
        run: mv assets/v001/v001_cairo_building.blend assets/v001/v001_cairo_building.blend-source
      - name: Import rendered sprites in Godot
        run: |
          godot --headless --path . --import 2>&1 | tee /tmp/v001-import.log
          if grep -E 'Blender path is invalid|SCRIPT ERROR:|Parse Error:' /tmp/v001-import.log; then
            echo "Godot importer failed"; exit 1
          fi
      - name: Test sprite registration and scene switching
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_v001_art.gd 2>&1 | tee /tmp/v001-art-test.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|No loader found|V001 P1: texture missing|V001 P1 texture missing' /tmp/v001-art-test.log; then
            echo "V001 Godot integration emitted runtime errors"; exit 1
          fi
          grep -q 'V001 P1 ART REGISTRATION PASS' /tmp/v001-art-test.log || {
            echo "V001 art acceptance marker missing, even if Godot exits zero"; exit 1;
          }
      - name: Restore editable Blender file for artifact
        if: always()
        run: |
          if test -f assets/v001/v001_cairo_building.blend-source; then
            mv assets/v001/v001_cairo_building.blend-source assets/v001/v001_cairo_building.blend
          fi
      - name: Upload editable Blender source and art review previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v001-blender-layers-and-previews
          path: assets/v001/
          if-no-files-found: warn
          retention-days: 14
