      - name: Run PLAY C4 autonomous NPC service demand, deterministic clock and replay
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_play_c4.gd 2>&1 | tee /tmp/play-c4.log
          grep -q 'PLAY C4: PASS' /tmp/play-c4.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|PLAY C4: FAIL)' /tmp/play-c4.log; then exit 1; fi
      - name: Run PLAY C5 social demand, NPC-only knowledge, trust and replay
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_play_c5.gd 2>&1 | tee /tmp/play-c5.log
          grep -q 'PLAY C5: PASS' /tmp/play-c5.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|PLAY C5: FAIL)' /tmp/play-c5.log; then exit 1; fi
      - name: Run PLAY C6 repeat-service feedback, ledger evidence and adversarial replay
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_play_c6.gd 2>&1 | tee /tmp/play-c6.log
          grep -q 'PLAY C6: PASS' /tmp/play-c6.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|PLAY C6: FAIL)' /tmp/play-c6.log; then exit 1; fi
      - name: E3 witnessed Salma Ink technique, hands-on P3 tea and deterministic replay
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_e3_tea_technique.gd 2>&1 | tee /tmp/e3-technique.log
          grep -q "E3 TEA TECHNIQUE: PASS" /tmp/e3-technique.log
      - name: E6 native real ambience context and persisted mute
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_e6_ambience.gd 2>&1 | tee /tmp/e6-ambience.log
          grep -q "E6 AMBIENCE: PASS" /tmp/e6-ambience.log
      - name: E3 learned tea technique from real Ink speech to P3 cooking
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_e3_tea_technique.gd 2>&1 | tee /tmp/e3-technique.log
          grep -q "E3 TEA TECHNIQUE: PASS" /tmp/e3-technique.log
      - name: E2 frozen-scope actual home recovery, depleted time chunks and replay
        run: |
          set -o pipefail
          timeout 150s godot --headless --path . --script res://tests/test_e2_closure.gd 2>&1 | tee /tmp/e2-closure.log
          grep -q "E2 CLOSURE: PASS" /tmp/e2-closure.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E2 CLOSURE: FAIL)' /tmp/e2-closure.log; then exit 1; fi
      - name: E6 native real game entry, autonomous demand and save/replay
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_e6_game_entry.gd 2>&1 | tee /tmp/e6-game.log
          grep -q 'E6 GAME ENTRY: PASS' /tmp/e6-game.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E6 GAME ENTRY: FAIL)' /tmp/e6-game.log; then exit 1; fi
      - name: Headless production game entry scene smoke
        run: |
          godot --headless --path . res://scenes/nile_kiosk_game.tscn --quit-after 20 2>&1 | tee /tmp/e6-scene.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E6_GAME_BOOT_FAILED)' /tmp/e6-scene.log; then exit 1; fi
      - name: E1 native canonical daily rhythm, closed demand, sleep and replay
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_e1_daily_life.gd 2>&1 | tee /tmp/e1-daily-life.log
          grep -q 'E1 DAILY LIFE: PASS' /tmp/e1-daily-life.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E1 DAILY LIFE: FAIL)' /tmp/e1-daily-life.log; then exit 1; fi
      - name: E4 authored event conditions, once-only social opportunities and replay
        run: |
