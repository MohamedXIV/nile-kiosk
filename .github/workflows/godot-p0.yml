      - name: E4 independent nonbuyer visit, canonical time, real Ink and whole-world replay
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_e4_nonbuyer_visit.gd 2>&1 | tee /tmp/e4-nonbuyer.log
          grep -q 'E4 NONBUYER VISIT: PASS' /tmp/e4-nonbuyer.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E4 NONBUYER VISIT: FAIL)' /tmp/e4-nonbuyer.log; then exit 1; fi
      - name: E4 returning-customer memory, real Ink and pending choice replay
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_e4_customer_memory.gd 2>&1 | tee /tmp/e4-customer-memory.log
          grep -q 'E4 CUSTOMER MEMORY: PASS' /tmp/e4-customer-memory.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E4 CUSTOMER MEMORY: FAIL)' /tmp/e4-customer-memory.log; then exit 1; fi
      - name: E4 independent conversation, spatial participation and real Ink replay
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_e4_living_conversation.gd 2>&1 | tee /tmp/e4-living.log
          grep -q 'E4 LIVING CONVERSATION: PASS' /tmp/e4-living.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E4 LIVING CONVERSATION: FAIL)' /tmp/e4-living.log; then exit 1; fi
      - name: E5 earned referral, paid stock, elapsed scheduler and save replay
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_e5_referral.gd 2>&1 | tee /tmp/e5-referral.log
          grep -q 'E5 REFERRAL: PASS' /tmp/e5-referral.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E5 REFERRAL: FAIL)' /tmp/e5-referral.log; then exit 1; fi
      - name: E5 public collection versus earned delivery and finite supply
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_e5_procurement.gd 2>&1 | tee /tmp/e5-procurement.log
          grep -q 'E5 PROCUREMENT: PASS' /tmp/e5-procurement.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E5 PROCUREMENT: FAIL)' /tmp/e5-procurement.log; then exit 1; fi
      - name: E1 quiet moments — native spatial activity, scheduler and disk replay
