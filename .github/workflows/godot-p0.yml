name: Godot P0 smoke

on:
  pull_request:
    paths:
      - project.godot
      - "content/world/**"
      - "content/navigation/**"
      - "content/service/**"
      - "content/life/**"
      - "content/social/**"
      - "content/economy/**"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/godot-p0.yml"
  push:
    branches: [main]
    paths:
      - "content/social/**"
      - "content/economy/**"
      - project.godot
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/godot-p0.yml"

permissions:
  contents: read

concurrency:
  group: godot-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream Dialogue Manager 3.10.4
        uses: actions/checkout@v4
        with:
          repository: nathanhoad/godot_dialogue_manager
          ref: 5487c524b9eac303b059e5859e2980b134c59d79
          path: _upstream_dialogue_manager
          persist-credentials: false
      - name: Install Dialogue Manager addon
        run: |
          mkdir -p addons
          cp -R _upstream_dialogue_manager/addons/dialogue_manager addons/dialogue_manager
          rm -rf _upstream_dialogue_manager
      - name: Fetch pinned inkgd Godot 4 runtime
        uses: actions/checkout@v4
        with:
          repository: ephread/inkgd
          ref: fea9098ee18d6cdbe9a5e25f8f0296bcdf0fd96a
          path: _upstream_inkgd
          persist-credentials: false
      - name: Install inkgd addon
        run: |
          mkdir -p addons
          cp -R _upstream_inkgd/addons/inkgd addons/inkgd
          rm -rf _upstream_inkgd
      - name: Install and verify pinned Ink compiler
        run: |
          curl -fL --retry 3 --output /tmp/inklecate_linux.zip https://github.com/inkle/ink/releases/download/v1.2.1/inklecate_linux.zip
          echo "1997ff5bca618c90003ecd5fecb286e7468abb955005a2a185042949642f8fb5  /tmp/inklecate_linux.zip" | sha256sum --check
          mkdir -p /tmp/inklecate
          unzip -q /tmp/inklecate_linux.zip -d /tmp/inklecate
          INKLECATE="$(find /tmp/inklecate -type f -name inklecate | head -n 1)"
          test -n "$INKLECATE"
          chmod +x "$INKLECATE"
          INKLECATE="$INKLECATE" bash tools/compile-ink.sh
      - name: Install pinned Godot standard
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path . --import
      - name: Run deterministic SYS P0 production world kernel tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_sys_p0.gd 2>&1 | tee /tmp/sys-p0.log
          grep -q 'SYS P0: PASS' /tmp/sys-p0.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|SYS P0: FAIL)' /tmp/sys-p0.log; then exit 1; fi
      - name: Run production SYS P1 World Time and Scheduler tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_sys_p1.gd 2>&1 | tee /tmp/sys-p1.log
          grep -q 'SYS P1: PASS' /tmp/sys-p1.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|SYS P1: FAIL)' /tmp/sys-p1.log; then exit 1; fi
      - name: Run SYS P2 NPC Life and Social Knowledge production acceptance
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_sys_p2.gd 2>&1 | tee /tmp/sys-p2.log
          grep -q 'SYS P2: PASS' /tmp/sys-p2.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|SYS P2: FAIL)' /tmp/sys-p2.log; then exit 1; fi
      - name: Run SYS P3 production cooking and inventory acceptance
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_sys_p3.gd 2>&1 | tee /tmp/sys-p3.log
          grep -q 'SYS P3: PASS' /tmp/sys-p3.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|SYS P3: FAIL)' /tmp/sys-p3.log; then exit 1; fi
      - name: Run SYS P4 production orders and service acceptance
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_sys_p4.gd 2>&1 | tee /tmp/sys-p4.log
          grep -q 'SYS P4: PASS' /tmp/sys-p4.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|SYS P4: FAIL)' /tmp/sys-p4.log; then exit 1; fi
      - name: Run SYS P5 ledger housing and home production acceptance
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_sys_p5.gd 2>&1 | tee /tmp/sys-p5.log
          grep -q 'SYS P5: PASS' /tmp/sys-p5.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|SYS P5: FAIL)' /tmp/sys-p5.log; then exit 1; fi
      - name: Run SYS P6 narrative domain hearing and replay
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_sys_p6_domain.gd 2>&1 | tee /tmp/sys-p6-domain.log
          grep -q 'SYS P6 domain PASS' /tmp/sys-p6-domain.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|SYS P6 domain FAIL)' /tmp/sys-p6-domain.log; then exit 1; fi
      - name: Run SYS P6 real Ink narrative, independent sessions and mid-choice disk restore
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_sys_p6_ink.gd 2>&1 | tee /tmp/sys-p6-ink.log
          grep -q 'SYS P6 Ink PASS' /tmp/sys-p6-ink.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|SYS P6 Ink FAIL)' /tmp/sys-p6-ink.log; then exit 1; fi
      - name: Run SYS P7 production whole-world integration, real Ink and disk reload acceptance
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/test_sys_p7.gd 2>&1 | tee /tmp/sys-p7.log
          grep -q 'SYS P7: PASS' /tmp/sys-p7.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|SYS P7: FAIL)' /tmp/sys-p7.log; then exit 1; fi
      - name: Run CONTENT C0 authored catalog import and atomic world bootstrapping tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_content_c0.gd 2>&1 | tee /tmp/content-c0.log
          grep -q 'CONTENT C0: PASS' /tmp/content-c0.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|CONTENT C0: FAIL)' /tmp/content-c0.log; then exit 1; fi
      - name: Run PLAY C1 authored portal traversal and world-interaction acceptance
        run: |
          set -o pipefail
