          if grep -E '(SCRIPT ERROR:|Parse Error:|E1 QUIET MOMENTS: FAIL)' /tmp/e1-quiet.log; then exit 1; fi
      - name: E1 P2 radio — actual P5 object use, scheduler and save replay
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_e1_radio.gd 2>&1 | tee /tmp/e1-radio.log
          grep -q 'E1 RADIO: PASS' /tmp/e1-radio.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E1 RADIO: FAIL)' /tmp/e1-radio.log; then exit 1; fi
      - name: E2 canonical needs, contextual activity, P3 food and P5 rest
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_e2_needs.gd 2>&1 | tee /tmp/e2-needs.log
          grep -q 'E2 NEEDS: PASS' /tmp/e2-needs.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|E2 NEEDS: FAIL)' /tmp/e2-needs.log; then exit 1; fi
      - name: Run deterministic P0 tests
        run: godot --headless --path . --script res://tests/test_p0.gd
      - name: Run Dialogue Manager P1 integration tests
        run: godot --headless --path . --script res://tests/test_dm_p1.gd
      - name: Run real Ink P2 two-session tests
        run: godot --headless --path . --script res://tests/test_ink_p2.gd
      - name: Run D001 P3 dual-engine save/load acceptance
        run: godot --headless --path . --script res://tests/test_save_roundtrip.gd
      - name: Run V001 P0 logical floor, cutaway and furniture tests
        run: godot --headless --path . --script res://tests/test_v001_p0.gd
      - name: Headless V001 building cutaway scene smoke
        run: |
          godot --headless --path . res://scenes/building_cutaway_spike.tscn --quit-after 10 2>&1 | tee /tmp/v001-scene.log
          if grep -E '(SCRIPT ERROR:|Parse Error:|Invalid call)' /tmp/v001-scene.log; then
            exit 1
          fi
      - name: Headless scene startup smoke
        run: godot --headless --path . --quit-after 10
      - name: Headless Dialogue Manager scene smoke
        run: godot --headless --path . res://scenes/dialogue_manager_spike.tscn --quit-after 10
      - name: Headless Ink scene smoke
        run: |
          godot --headless --path . res://scenes/ink_spike.tscn --quit-after 10 2>&1 | tee /tmp/ink-scene.log
          if grep -E '(SCRIPT ERROR:|Parent node is busy)' /tmp/ink-scene.log; then
            echo "Godot scene emitted a runtime error even though process exited successfully"
            exit 1
          fi
